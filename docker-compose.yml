version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: corporate_db_postgres
    restart: always
    environment:
      POSTGRES_DB: corporate_db
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: riwi
    ports: 
        - "5432:5432"
    volumes: 
        - postgres_data:/var/lib/postgresql/data

volumes: 
    postgres_data:
